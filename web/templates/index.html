<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proteus UI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <h1>Proteus</h1>
        <p class="subtitle">Image Processor</p>
      </div>

      <form id="uploadForm" class="card">
        <label class="field">
          <span>File</span>
          <div class="file-upload-wrapper">
            <input
              type="file"
              name="image"
              id="imageInput"
              accept="image/*"
              required
            />
            <label for="imageInput" class="file-upload-btn">
              Choose file
            </label>
            <span id="fileName" class="file-name">No file chosen</span>
          </div>
        </label>

        <label class="field">
          <span>Action</span>
          <select name="action" id="actionSelect">
            <option value="resize">resize</option>
            <option value="thumbnail">thumbnail</option>
            <option value="watermark">watermark</option>
          </select>
        </label>

        <label class="field small" id="widthField">
          <span>Width (px)</span>
          <input type="number" name="width" id="widthInput" min="1" />
        </label>

        <label class="field small" id="heightField">
          <span>Height (px)</span>
          <input type="number" name="height" id="heightInput" min="1" />
        </label>

        <label class="field" id="watermarkField">
          <span>Watermark text</span>
          <input
            type="text"
            name="watermark"
            id="watermarkInput"
            placeholder="Enter watermark text"
          />
        </label>

        <div class="buttons">
          <button type="submit">Upload</button>
          <button type="button" id="clearBtn">Clear</button>
        </div>
      </form>

      <section class="card">
        <h2>Search by ID</h2>
        <div class="field">
          <span>Image ID</span>
          <input
            type="text"
            id="searchIdInput"
            placeholder="Enter image ID to load"
          />
        </div>
        <div class="buttons">
          <button type="button" id="searchBtn">Search</button>
        </div>
      </section>

      <section class="status card" id="statusBlock" hidden>
        <div id="statusText">Waiting for upload...</div>
        <div id="statusIdBlock" style="margin-top: 4px" hidden>
          ID: <span id="statusImageId"></span>
        </div>
      </section>

      <section class="preview card" id="previewBlock" hidden>
        <h2>Result</h2>
        <img id="resultImage" alt="result" />

        <div class="meta">
          ID:
          <span id="imageId"></span>
          <button
            id="copyIdBtn"
            class="copy-btn"
            title="Copy ID to clipboard"
            type="button"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 16v-4m4 4v4m-8-8h8a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z"
              />
            </svg>
          </button>
        </div>

        <div class="buttons">
          <button id="downloadBtn">Download</button>
          <button id="deleteBtn">Delete</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>

    <script>
      const imageInput = document.getElementById("imageInput");
      const fileNameEl = document.getElementById("fileName");

      imageInput.addEventListener("change", () => {
        if (imageInput.files && imageInput.files.length > 0) {
          fileNameEl.textContent = imageInput.files[0].name;
        } else {
          fileNameEl.textContent = "No file chosen";
        }
      });
    </script>
  </body>
</html>

# Logger configuration
logger:
  log_directory:                                        # Directory for logs, must be mounted via docker-compose volume; if empty, logs are written to stdout
  debug_mode: true                                      # Enable debug-level logging

# HTTP server configuration
server:
  port: "8080"                                          # Port where the HTTP server listens; must match the exposed port in docker-compose.full.yaml
  read_timeout: 5s                                      # Maximum duration for reading the entire request
  write_timeout: 10s                                    # Maximum duration before timing out response writes
  max_header_bytes: 1048576                             # Maximum allowed size of request headers (1 MB).
  max_file_size: 10485760                               # Maximum size of a single uploaded image (10 MB).
  max_request_size: 12582912                            # Maximum total size of the request (including form data) — 12 MB.
  shutdown_timeout: 10s                                 # Timeout for graceful server shutdown

# Service configuration
service:
  cleaner: true                                         # Automatically clean up deleted and orphan images on a schedule
  cleanup_interval: 1m                                  # Interval between meta storage and image storage cleanups

# Repository (Storage) configuration        
repository:
  meta_storage:
    goose_dialect: "postgres"                           # Dialect used by goose migrations
    goose_migrations_directory: "./migrations"          # Directory containing migration files
    host: localhost                                     # Database host
    port: "5433"                                        # Database port
    dbname: proteus-db                                  # Database name
    sslmode: disable                                    # SSL mode for database connection
    max_open_conns: 20                                  # Maximum number of open database connections
    max_idle_conns: 10                                  # Maximum number of idle connections
    conn_max_lifetime: 30m                              # Maximum lifetime of a database connection
    pending_timeout: 1m                                 # How long an image can stay in "pending" status before being cleaned up.
    query_retry_strategy:
      attempts: 3                                       # Number of retry attempts for failed DB queries
      delay: 200ms                                      # Initial delay between retries
      backoff: 2                                        # Backoff multiplier for retry delay
  image_storage:
    minio_endpoint: localhost:9000                      # MinIO server address (service name in Docker).
    minio_bucket: images                                # Bucket name where images will be stored.
    minio_use_ssl: false                                # Use HTTPS for MinIO connection.
    minio_region: us-east-1                             # Region passed to MinIO client.

# Kafka Consumer configuration
consumer:
  brokers:
    - localhost:9092                                    # List of Kafka brokers for the consumer
  topic: images                                         # Topic to consume messages from
  group_id: image-consumers                             # Consumer group ID
  fetch_retry_strategy:
    attempts: 3                                         # Number of retry attempts for consumer fetch
    delay: 200ms                                        # Initial delay between retries
    backoff: 2                                          # Backoff multiplier for retry delay

# Kafka Producer configuration
producer:
  brokers:
    - localhost:9092                                    # List of Kafka brokers for the consumer
  topic: images                                         # Topic to consume messages from